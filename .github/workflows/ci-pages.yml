name: CI and Pages
# GitHub Pages source enabled by repository owner; public routes are verified after deployment.

on:
  push:
    branches: [main, feat/webgpu-realism-complete]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: apps/playground/dist

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  online-verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify published routes
        env:
          SITE_URL: https://urashima.github.io/Kyxos-Render-Lab
        run: |
          set -euo pipefail
          for route in latest/ latest/overview/ latest/full-stack/ latest/lifecycle/; do
            url="$SITE_URL/$route"
            body="$(mktemp)"
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 12 \
              --retry-delay 5 \
              --retry-all-errors \
              "$url" \
              --output "$body"
            grep --quiet "Kyxos Render Lab" "$body"
          done

  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify, deploy, online-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish stable and online verification tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin :refs/tags/ci-pages-failed || true
          git push origin :refs/tags/pages-online-failed || true
          if ! git rev-parse v0.1.0 >/dev/null 2>&1; then
            git tag -a v0.1.0 -m "Kyxos Render Lab v0.1.0" "$GITHUB_SHA"
            git push origin v0.1.0
          fi
          git tag --force pages-online-verified "$GITHUB_SHA"
          git push --force origin pages-online-verified

  failure-marker:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.verify.result != 'success' ||
       needs.deploy.result != 'success' ||
       needs.online-verify.result != 'success')
    needs: [verify, deploy, online-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish failure markers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force ci-pages-failed "$GITHUB_SHA"
          git push --force origin ci-pages-failed
          if [ "${{ needs.online-verify.result }}" != "success" ]; then
            git tag --force pages-online-failed "$GITHUB_SHA"
            git push --force origin pages-online-failed
          fi
